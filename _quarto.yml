project:
  type: book
  output-dir: docs
  
base-url: https://docnikds.github.io/EpoDicTum/

book:
  title: "EPONYMOUS DICTIONARY OF TUMORS"
  subtitle: "v. 1.0"
  author: "Nikolai Danilov, MD, MPH"
  date: today
  date-format: "D MMMM YYYY"                
  publisher: "@DocNikDS | Haifa, Israel"
  cover-image: images/cover.png
  image: images/cover.png
  search: true
  page-navigation: true                     
  chapters:
    - cover.qmd
    - copyright.qmd
    - index.qmd
    - EPODICTUM.qmd
    - references.qmd
    - personalia.qmd

bibliography: references.bib

format:
  html:
    cover-image: images/cover.png
    toc: true
    toc-depth: 3
    number-sections: false
    css: styles.css
    chunk-level: 3                          
    lightbox: auto
  pdf:
    cover-image: images/cover.png
    include-in-header: preamble.tex
    toc: true
    toc-depth: 3
    number-sections: false
    css: styles.css                         
    chunk-level: 3                          
    papersize: a4
    fontsize: 12pt
    geometry:
      - top=2.5cm
      - bottom=2.5cm
      - left=2.5cm
      - right=2.5cm
    fig-align: center
    fig-width: 5
    fig-height: 5
    